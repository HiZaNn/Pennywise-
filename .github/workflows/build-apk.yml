
name: Build Pennywise Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV

      - name: Install dependencies
        run: npm install

      - name: Build web app
        run: npm run build

      - name: Add Android platform
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Generate Pennywise launcher icons
        run: |
          python -m pip install pillow

          python - <<'PY'
          from PIL import Image
          from pathlib import Path

          logo = Image.open("pennywise-icon.png").convert("RGBA")
          base = Path("android/app/src/main/res")

          legacy = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192
          }

          adaptive = {
              "mdpi": 108,
              "hdpi": 162,
              "xhdpi": 216,
              "xxhdpi": 324,
              "xxxhdpi": 432
          }

          for density, size in legacy.items():
              folder = base / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              for name in ["ic_launcher.png", "ic_launcher_round.png"]:
                  for old in folder.glob(name.rsplit(".", 1)[0] + ".*"):
                      old.unlink()

                  logo.resize(
                      (size, size),
                      Image.Resampling.LANCZOS
                  ).save(folder / name)

          for density, size in adaptive.items():
              folder = base / f"mipmap-{density}"
              folder.mkdir(parents=True, exist_ok=True)

              for old in folder.glob("ic_launcher_foreground.*"):
                  old.unlink()

              canvas = Image.new(
                  "RGBA", (size, size), (0, 0, 0, 0)
              )

              icon = logo.resize(
                  (int(size * 0.667), int(size * 0.667)),
                  Image.Resampling.LANCZOS
              )

              offset = (size - icon.width) // 2
              canvas.alpha_composite(icon, (offset, offset))
              canvas.save(folder / "ic_launcher_foreground.png")

          folder = base / "mipmap-anydpi-v26"
          folder.mkdir(parents=True, exist_ok=True)

          xml = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          '''

          (folder / "ic_launcher.xml").write_text(xml)
          (folder / "ic_launcher_round.xml").write_text(xml)

          values = base / "values"
          values.mkdir(parents=True, exist_ok=True)

          (values / "ic_launcher_background.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#000000</color>
          </resources>
          '''
          )

          print("Pennywise launcher icons generated successfully!")
          PY

      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pennywise-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
